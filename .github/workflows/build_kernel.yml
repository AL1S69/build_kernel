name: build_kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v2

      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: set up environment
        run: |
          echo "安装依赖"
          sudo apt update -y
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip zipalign language-pack-zh-hans

      - name: pull kernel and compiler
        run: |
          echo "拉取源码和编译器"
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_lavender.git -b lineage-21.0 kernel_src
          echo "拉取源码完成"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang -b master clang

      - name: build kernel
        run: |
          echo "开始编译内核"
          wget https://raw.githubusercontent.com/zahi0/build_kernel/main/build_tool.sh
          chmod +x build_tool.sh
          ./build_tool.sh

      - name: upload kernel image
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: kernel
          path: kernel_src/arch/arm64/boot/Image.gz-dtb
